[package]
name = "libre-ai-contract-types"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "Apache-2.0"
repository = "https://github.com/libre-ai/sdk-rs"
publish = false
build = "build.rs"

[dependencies]
chrono = { version = "=0.4.45", default-features = false, features = ["serde", "std"] }
jsonschema = { version = "=0.47.0", default-features = false }
regress = { version = "=0.11.1", default-features = false, features = ["backend-pikevm", "prohibit-unsafe", "std"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.151", features = ["float_roundtrip"] }

[dev-dependencies]
sha2 = { version = "=0.11.0", default-features = false }

[build-dependencies]
schemars = "=1.2.2"
serde_json = { version = "=1.0.151", features = ["float_roundtrip"] }
typify = { version = "=0.7.0", default-features = false }

[workspace]
